name: Bug report
description: Report a reproducible problem
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do **not** include secrets, Feishu app ids/secrets, chat ids, document tokens, or private absolute paths. Redact logs before pasting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the observed behavior.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: The smallest sequence that reproduces the problem.
      placeholder: |
        1. Configure ...
        2. Send ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "v0.1.0 or a commit hash"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact credentials, chat ids, open ids, document tokens, and private paths.
      render: text
    validations:
      required: false
